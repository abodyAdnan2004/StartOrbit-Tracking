version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: orbit-postgres
    environment:
      POSTGRES_DB: orbit_tracking
      POSTGRES_USER: orbit_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secure_password_change_me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orbit_user -d orbit_tracking"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - orbit-network

  # Backend API
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    container_name: orbit-backend
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://orbit_user:${POSTGRES_PASSWORD:-secure_password_change_me}@postgres:5432/orbit_tracking?schema=public
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-key-change-in-production-min-32-chars}
      JWT_EXPIRES_IN: 15m
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-your-super-secret-refresh-key-change-in-production-min-32-chars}
      JWT_REFRESH_EXPIRES_IN: 7d
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3029}
      SOCKET_CORS_ORIGIN: ${FRONTEND_URL:-http://localhost:3029}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - orbit-network
    restart: unless-stopped

  # Prisma Studio (optional - for database management)
  prisma-studio:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    container_name: orbit-prisma-studio
    command: npx prisma studio --hostname 0.0.0.0 --port 5555
    environment:
      DATABASE_URL: postgresql://orbit_user:${POSTGRES_PASSWORD:-secure_password_change_me}@postgres:5432/orbit_tracking?schema=public
    ports:
      - "5555:5555"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - orbit-network
    profiles:
      - tools

volumes:
  postgres_data:

networks:
  orbit-network:
    driver: bridge